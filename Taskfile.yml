version: "3"

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

vars:
  APP_NAME:
    sh: . ./project.env && printf "%s" "$APP_BINARY_NAME"
  APP_DISPLAY_NAME:
    sh: . ./project.env && printf "%s" "$APP_DISPLAY_NAME"
  BIN_DIR: "bin"
  VITE_PORT: "{{.WAILS_VITE_PORT | default 43827}}"
  APP_VERSION:
    sh: . ./project.env && printf "%s" "${APP_VERSION#v}"
  MACOS_MIN_VERSION:
    sh: . ./project.env && printf "%s" "$MACOS_MIN_VERSION"
  BUILD_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo dev
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  build:
    summary: 构建应用（当前平台）
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: 打包生产版本
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: 运行应用
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: 开发模式运行
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:darwin:
    summary: 构建 macOS 二进制
    cmds:
      - task: darwin:build
        vars:
          ARCH: "{{.ARCH | default ARCH}}"

  package:darwin:
    summary: 打包 macOS .app
    cmds:
      - task: darwin:package
        vars:
          ARCH: "{{.ARCH | default ARCH}}"

  dmg:darwin:
    summary: 打包 macOS .app 并制作 DMG（含解除安全限制脚本与说明）
    cmds:
      - task: darwin:dmg
        vars:
          ARCH: "{{.ARCH | default ARCH}}"

  release:all:
    summary: 一键构建 macOS DMG + Windows .exe（产物在 bin/）；macOS 交叉编译 Windows 需先安装 mingw-w64（brew install mingw-w64）
    cmds:
      # 先强制以 -ts 重新生成 bindings（绕过 Task 指纹缓存），避免残留的 .js bindings 导致前端 tsc 构建失败
      - wails3 generate bindings -f '-tags production' -clean=true -ts
      - task: dmg:darwin
        vars:
          ARCH: "{{.MAC_ARCH | default ARCH}}"
      - task: package:windows
        vars:
          ARCH: '{{.WIN_ARCH | default "amd64"}}'
      - echo "✅ 全部产物已生成于 bin/：DMG（macOS）+ .exe（Windows）"

  build:windows:
    summary: 构建 Windows 二进制（.exe）
    cmds:
      - task: windows:build
        vars:
          ARCH: '{{.ARCH | default "amd64"}}'

  package:windows:
    summary: 打包 Windows 生产版本（.exe）
    cmds:
      - task: windows:package
        vars:
          ARCH: '{{.ARCH | default "amd64"}}'
