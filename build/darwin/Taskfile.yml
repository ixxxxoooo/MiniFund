version: "3"

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: 构建 macOS 二进制
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          DEV:
            ref: .DEV
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT}}
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X minifund/internal/version.Version={{.APP_VERSION}} -X minifund/internal/version.Commit={{.BUILD_COMMIT}} -X minifund/internal/version.BuildDate={{.BUILD_DATE}}"{{end}}'
      DEFAULT_OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}"
      OUTPUT: "{{.OUTPUT | default .DEFAULT_OUTPUT}}"
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: "{{.ARCH | default ARCH}}"
      CGO_CFLAGS: "-mmacosx-version-min={{.MACOS_MIN_VERSION}}"
      CGO_LDFLAGS: "-mmacosx-version-min={{.MACOS_MIN_VERSION}}"
      MACOSX_DEPLOYMENT_TARGET: "{{.MACOS_MIN_VERSION}}"

  package:
    summary: 打包 .app bundle
    cmds:
      - task: build
        vars:
          ARCH: "{{.ARCH}}"
      - task: create:app:bundle

  create:app:bundle:
    summary: 创建 .app bundle
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - |
        if [ -f build/darwin/icons.icns ]; then
          cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
        else
          echo "提示：未找到 build/darwin/icons.icns，跳过图标（可先执行 wails3 task common:generate:icons）"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      # 先清理扩展属性（资源分叉/Finder 信息）与 AppleDouble 残留文件，否则 codesign 会报 "detritus not allowed"
      # 注意：不能用 dot_clean——它会把 ._ 文件并回资源分叉，反而制造 detritus。
      - find "{{.BIN_DIR}}/{{.APP_NAME}}.app" -name '._*' -delete 2>/dev/null || true
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  dmg:
    summary: 打包 .app 并制作 DMG（含解除安全限制脚本与说明）
    cmds:
      - task: package
        vars:
          ARCH: "{{.ARCH}}"
      - task: create:dmg
        vars:
          ARCH: "{{.ARCH}}"

  create:dmg:
    summary: 将 .app、应用程序软链、解除限制脚本与说明打包为 DMG
    cmds:
      - rm -rf "{{.BIN_DIR}}/dmg-staging"
      - mkdir -p "{{.BIN_DIR}}/dmg-staging"
      # 在 DMG 内将 bundle 重命名为展示名，访达中显示为 MiniFund
      - cp -R "{{.BIN_DIR}}/{{.APP_NAME}}.app" "{{.BIN_DIR}}/dmg-staging/{{.APP_DISPLAY_NAME}}.app"
      # 拖拽安装目标：指向「应用程序」的软链
      - ln -sf /Applications "{{.BIN_DIR}}/dmg-staging/应用程序"
      # 随包附带：解除安全限制脚本 + 首次打开说明
      - cp "build/darwin/dmg/解除安全限制.command" "{{.BIN_DIR}}/dmg-staging/解除安全限制.command"
      - chmod +x "{{.BIN_DIR}}/dmg-staging/解除安全限制.command"
      - cp "build/darwin/dmg/首次打开必读.txt" "{{.BIN_DIR}}/dmg-staging/首次打开必读.txt"
      # 清理扩展属性，避免把 quarantine/Finder 信息带进映像
      - find "{{.BIN_DIR}}/dmg-staging" -name '._*' -delete 2>/dev/null || true
      - xattr -cr "{{.BIN_DIR}}/dmg-staging" 2>/dev/null || true
      - rm -f "{{.OUTPUT_DMG}}"
      - hdiutil create -volname "{{.APP_DISPLAY_NAME}}" -srcfolder "{{.BIN_DIR}}/dmg-staging" -ov -format UDZO "{{.OUTPUT_DMG}}"
      - rm -rf "{{.BIN_DIR}}/dmg-staging"
      - echo "DMG 已生成：{{.OUTPUT_DMG}}"
    vars:
      ARCH_NAME: '{{.ARCH | default ARCH}}'
      OUTPUT_DMG: '{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}-{{.APP_VERSION}}-{{.ARCH | default ARCH}}.dmg'

  run:
    summary: 以 .app 形式运行（保证托盘/通知等系统能力正常）
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - |
        if [ -f build/darwin/icons.icns ]; then
          cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - find "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app" -name '._*' -delete 2>/dev/null || true
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"
