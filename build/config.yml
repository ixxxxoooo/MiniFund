version: "3"

info:
  companyName: "MiniFund Contributors"
  productName: "MiniFund"
  productIdentifier: "com.minifund.app"
  description: "基金监控桌面工具"
  copyright: "(c) 2026, MiniFund Contributors"
  comments: "基金监控桌面工具"
  version: "0.0.1"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - dist
      - docs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task build DEV=true
      type: blocking
    - cmd: wails3 task run
      type: primary

fileAssociations: []
