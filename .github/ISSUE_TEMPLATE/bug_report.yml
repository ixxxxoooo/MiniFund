name: 🐛 Bug 报告
description: 报告一个问题，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整信息，便于复现与定位。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 清晰描述遇到的问题。
      placeholder: 我在……时，出现了……
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步说明如何复现。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - 其它
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 见「设置」页或 Release 标签，如 v1.0.0。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        如可能，请附上日志（敏感信息请打码）。
        - macOS：~/Library/Logs/MiniFund/minifund.log
        - Windows：%LocalAppData%\MiniFund\logs\minifund.log
      render: text
    validations:
      required: false
