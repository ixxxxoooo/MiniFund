name: CI

# 持续集成：仅在 GitHub Actions 页面手动点击「Run workflow」时运行 Go 与前端检查；
# 不再随 push / PR 自动触发，避免每次推送都消耗额度。
on:
  workflow_dispatch:

# 取消同一分支上正在进行的旧任务，节省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go 检查（测试 / vet / 格式）
    # 在 macOS 上运行：与开发环境一致，且 CGO + go-sqlite3 + Wails 依赖齐全。
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # main.go 通过 //go:embed all:frontend/dist 嵌入前端产物。
      # 本 Go 检查任务不构建前端，需确保该目录非空，否则 embed 会报
      # "pattern all:frontend/dist: no matching files found"。
      - name: 准备 go:embed 占位文件
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: 校验 gofmt 格式
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './frontend/*'))
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet 静态检查
        run: go vet ./...

      - name: 运行单元测试
        run: go test ./...

      - name: 校验整体可编译
        run: go build ./...

  frontend:
    name: 前端检查（测试 / 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 启用 pnpm
        run: corepack enable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行前端测试
        run: pnpm test

      - name: 构建前端
        run: pnpm build
